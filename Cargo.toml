[package]
name = "throttled-tracing"
version = "0.1.0"
edition = "2024"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Periodic and throttled logging macros for the tracing ecosystem"
repository = "https://github.com/aovestdipaperino/throttled-tracing"
documentation = "https://docs.rs/throttled-tracing"
readme = "README.md"
keywords = ["tracing", "logging", "periodic", "throttle", "rate-limit"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[dependencies]
tracing = "0.1"
parking_lot = "0.12"
fastrand = "2"

[dev-dependencies]
tracing-subscriber = "0.3"
